<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>协议客户端模拟器</title>
    <style>
      :root {
        --bg: #eef4f1;
        --panel: rgba(251, 255, 253, 0.92);
        --ink: #183028;
        --line: #c8d9cf;
        --accent: #1f7a60;
        --accent-soft: #ddf1e8;
        --muted: #5f726a;
        --warn: #9f5b23;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, #d7f1df 0, transparent 24%),
          linear-gradient(135deg, #e7f0e8, var(--bg));
      }

      main {
        max-width: 1480px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero,
      .card {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel);
        backdrop-filter: blur(6px);
      }

      .hero {
        margin-bottom: 18px;
      }

      .status {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }

      .layout {
        display: grid;
        gap: 16px;
        grid-template-columns: 1.25fr 0.95fr;
      }

      .left,
      .right {
        display: grid;
        gap: 16px;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .section-head h2,
      .section-head h3,
      h1,
      h2,
      h3 {
        margin: 0;
      }

      .field-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field-grid.tight {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
        color: var(--ink);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .inline-check {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 28px;
      }

      .inline-check input {
        width: auto;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }

      button.secondary {
        background: #8ca196;
      }

      button.ghost {
        background: #d8e5de;
        color: var(--ink);
      }

      button.warn {
        background: var(--warn);
      }

      .summary-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .summary-item {
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.8);
      }

      .summary-item strong {
        display: block;
        margin-bottom: 4px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      .table-wrap,
      .logs {
        max-height: 360px;
        overflow: auto;
      }

      .logs {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }

      .log {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .muted {
        color: var(--muted);
      }

      .small-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      @media (max-width: 1100px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .field-grid,
        .field-grid.tight,
        .summary-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>协议客户端模拟器</h1>
        <p>默认固化为已验证可连接第三方服务端的兼容格式，同时保留自动探测作为备用模式。</p>
        <div id="status" class="status">未连接</div>
      </section>

      <section class="layout">
        <div class="left">
          <div class="card">
            <div class="section-head">
              <h2>连接与协议</h2>
              <div class="small-actions">
                <button id="connectBtn" type="button">连接并注册</button>
                <button id="disconnectBtn" type="button" class="secondary">断开</button>
              </div>
            </div>
            <div class="field-grid">
              <div>
                <label for="tcpHost">服务端地址</label>
                <input id="tcpHost" />
              </div>
              <div>
                <label for="tcpPort">服务端 TCP 端口</label>
                <input id="tcpPort" type="number" />
              </div>
              <div>
                <label for="protocolMode">协议模式</label>
                <select id="protocolMode"></select>
              </div>
              <div>
                <label for="preferredProtocolPresetId">固定协议格式</label>
                <select id="preferredProtocolPresetId"></select>
              </div>
            </div>
            <div class="actions">
              <button data-action="register" type="button">手动注册</button>
              <button data-action="heartbeat" type="button" class="ghost">发送心跳</button>
              <button data-action="startup" type="button" class="ghost">补发开机信息</button>
              <button data-action="timeSyncRequest" type="button" class="ghost">请求时间同步</button>
            </div>
          </div>

          <div class="card">
            <div class="section-head">
              <h2>设备参数</h2>
              <button id="reportDeviceBtn" type="button" class="ghost">整包上报设备信息</button>
            </div>
            <div class="field-grid tight">
              <div>
                <label for="model">设备型号</label>
                <input id="model" type="number" />
              </div>
              <div>
                <label for="deviceId">设备编号</label>
                <input id="deviceId" type="number" />
              </div>
              <div>
                <label for="name">设备名称</label>
                <input id="name" />
              </div>
              <div>
                <label for="flag">设备标志符</label>
                <input id="flag" />
              </div>
              <div>
                <label for="userId">用户 ID</label>
                <input id="userId" />
              </div>
              <div>
                <label for="patternId">当前花型编号</label>
                <input id="patternId" type="number" />
              </div>
              <div style="grid-column: 1 / -1">
                <label for="patternName">当前花型名称</label>
                <input id="patternName" />
              </div>
              <div>
                <label for="xRange">X 范围 (0.1mm)</label>
                <input id="xRange" type="number" />
              </div>
              <div>
                <label for="yRange">Y 范围 (0.1mm)</label>
                <input id="yRange" type="number" />
              </div>
              <div>
                <label for="maxSpeed">最高速度</label>
                <input id="maxSpeed" type="number" />
              </div>
              <div>
                <label for="currentSpeed">当前速度</label>
                <input id="currentSpeed" type="number" />
              </div>
              <div>
                <label for="highPoint">中压脚高点 (0.1mm)</label>
                <input id="highPoint" type="number" />
              </div>
              <div>
                <label for="lowPoint">中压脚低点 (0.1mm)</label>
                <input id="lowPoint" type="number" />
              </div>
              <div>
                <label for="oilPrompt">油量提示</label>
                <input id="oilPrompt" type="number" />
              </div>
              <div>
                <label for="alarmCode">报警号</label>
                <input id="alarmCode" type="number" />
              </div>
              <div>
                <label for="idleAlarmMinutes">空闲报警分钟</label>
                <input id="idleAlarmMinutes" type="number" />
              </div>
              <div>
                <label for="idleAlarmStatus">空闲报警状态</label>
                <input id="idleAlarmStatus" type="number" />
              </div>
              <div>
                <label for="productionTotal">总生产量</label>
                <input id="productionTotal" type="number" />
              </div>
              <div>
                <label for="productionCurrent">当前生产量</label>
                <input id="productionCurrent" type="number" />
              </div>
              <div>
                <label for="bottomThreadTotal">底线总数</label>
                <input id="bottomThreadTotal" type="number" />
              </div>
              <div>
                <label for="bottomThreadRemain">底线剩余</label>
                <input id="bottomThreadRemain" type="number" />
              </div>
              <div>
                <label for="currentNeedleNumber">当前针号</label>
                <input id="currentNeedleNumber" type="number" />
              </div>
              <div>
                <label for="completedNeedleCount">完成针数</label>
                <input id="completedNeedleCount" type="number" />
              </div>
              <div>
                <label for="stopReason">停止原因</label>
                <input id="stopReason" type="number" />
              </div>
              <div>
                <label for="sewingStatus">缝纫状态</label>
                <input id="sewingStatus" type="number" />
              </div>
              <div>
                <label for="realtimeStatus">实时状态</label>
                <input id="realtimeStatus" type="number" />
              </div>
            </div>
          </div>

          <div class="card">
            <div class="section-head">
              <h2>动作面板</h2>
            </div>
            <div class="actions">
              <button data-action="reportCurrentSpeed" type="button">上报当前速度</button>
              <button data-action="reportHighPoint" type="button" class="ghost">上报高点</button>
              <button data-action="reportLowPoint" type="button" class="ghost">上报低点</button>
              <button data-action="reportRealtimeStatus" type="button" class="ghost">上报实时状态</button>
              <button data-action="reportAlarm" type="button" class="warn">发送报警</button>
              <button data-action="clearAlarm" type="button" class="ghost">清除报警</button>
              <button data-action="reportIdleAlarm" type="button" class="ghost">发送空闲报警</button>
              <button data-action="reportOilPrompt" type="button" class="ghost">发送油量提示</button>
              <button data-action="startSewing" type="button">开始缝纫</button>
              <button data-action="markSewingRunning" type="button" class="ghost">缝纫中</button>
              <button data-action="stopSewing" type="button" class="secondary">停止缝纫</button>
              <button data-action="reportNeedleCount" type="button" class="ghost">发送完成针数</button>
              <button data-action="threadTrim" type="button" class="ghost">发送剪线完成</button>
              <button data-action="productionOld" type="button" class="ghost">发送旧生产数据</button>
              <button data-action="productionNew" type="button" class="ghost">发送新生产数据</button>
              <button data-action="requestServerPatternList" type="button" class="ghost">请求服务器花型列表</button>
            </div>
            <div class="field-grid" style="margin-top: 16px">
              <div>
                <label for="resumeUploadFrame">上传续传帧号</label>
                <input id="resumeUploadFrame" type="number" value="1" />
              </div>
              <div>
                <label for="resumeDownloadFrame">下载续传帧号</label>
                <input id="resumeDownloadFrame" type="number" value="1" />
              </div>
            </div>
            <div class="actions">
              <button id="resumeUploadBtn" type="button" class="ghost">发送上传续传</button>
              <button id="resumeDownloadBtn" type="button" class="ghost">发送下载续传</button>
            </div>
          </div>

          <div class="card">
            <div class="section-head">
              <h2>本地花型库</h2>
            </div>
            <div class="field-grid">
              <div>
                <label for="patternDraftId">花型编号</label>
                <input id="patternDraftId" type="number" />
              </div>
              <div>
                <label for="patternDraftName">花型名称</label>
                <input id="patternDraftName" />
              </div>
              <div style="grid-column: 1 / -1">
                <label for="patternDraftData">花型数据文本</label>
                <textarea id="patternDraftData"></textarea>
              </div>
              <div class="inline-check">
                <input id="patternActivateNow" type="checkbox" />
                <label for="patternActivateNow">保存后设为当前花型</label>
              </div>
            </div>
            <div class="actions">
              <button id="savePatternBtn" type="button">保存花型</button>
              <button id="activatePatternBtn" type="button" class="ghost">设为当前花型</button>
              <button id="deletePatternBtn" type="button" class="warn">删除花型</button>
            </div>
            <div class="table-wrap" style="margin-top: 16px">
              <table>
                <thead>
                  <tr>
                    <th>编号</th>
                    <th>名称</th>
                    <th>大小</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="localPatternsTable"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="right">
          <div class="card">
            <div class="section-head">
              <h2>会话摘要</h2>
            </div>
            <div id="summaryGrid" class="summary-grid"></div>
          </div>

          <div class="card">
            <div class="section-head">
              <h2>服务器花型列表</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>花型名称</th>
                  </tr>
                </thead>
                <tbody id="serverPatternsTable"></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="section-head">
              <h2>传输状态</h2>
            </div>
            <div id="transferSummary" class="summary-grid"></div>
          </div>

          <div class="card">
            <div class="section-head">
              <h2>客户端日志</h2>
              <button id="clearLogsBtn" type="button" class="ghost">清除日志</button>
            </div>
            <div id="logs" class="logs"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
  </html>
