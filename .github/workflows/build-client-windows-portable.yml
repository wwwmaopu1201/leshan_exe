name: Build Client Windows Installer

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: boer-lan-client
        run: npm install

      - name: Build Tauri app
        working-directory: boer-lan-client
        run: npm run tauri:build -- --bundles nsis

      - name: Rename installer
        working-directory: boer-lan-client
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Rename-Item -LiteralPath $installer.FullName -NewName "bohr-client-$version-x64-setup.exe"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-windows-nsis
          path: boer-lan-client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boer-lan-client/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
