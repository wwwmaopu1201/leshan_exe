name: Build Server Windows Installer

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: boer-lan-server/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: boer-lan-server/backend/go.mod
          cache-dependency-path: boer-lan-server/backend/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: boer-lan-server
        run: npm ci

      - name: Build Go backend exe
        working-directory: boer-lan-server/backend
        run: go build -ldflags="-s -w" -o ../src-tauri/backend-server.exe cmd/server/main.go

      - name: Build Tauri app
        working-directory: boer-lan-server
        run: npm run tauri:build -- --bundles nsis

      - name: Rename installer
        working-directory: boer-lan-server
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Rename-Item -LiteralPath $installer.FullName -NewName "bohr-server-$version-x64-setup.exe"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-windows-nsis
          path: boer-lan-server/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boer-lan-server/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
