name: Build Client Windows 7 Browser Shell

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: boer-lan-client/package-lock.json

      - name: Setup Go 1.20 for Windows 7
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'

      - name: Install dependencies
        working-directory: boer-lan-client
        run: npm ci

      - name: Build frontend for Windows 7 shell
        working-directory: boer-lan-client
        run: npm run build:win7

      - name: Package Windows 7 browser shell
        shell: pwsh
        run: |
          $version = (Get-Content boer-lan-client/package.json | ConvertFrom-Json).version
          $packageDir = "artifacts/client-win7-shell"
          $embeddedDist = "tools/win7-launcher/embedded-dist"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path $embeddedDist | Out-Null
          Remove-Item -Recurse -Force "$embeddedDist/*"
          Copy-Item -Recurse -Force "boer-lan-client/dist/*" "$embeddedDist/"
          go build -ldflags='-s -w -X main.defaultMode=client -X "main.defaultTitle=Boer LAN Client"' -o "$packageDir/Boer-LAN-Client-Win7.exe" ./tools/win7-launcher/main.go
          New-Item -ItemType Directory -Force -Path "$packageDir/browser" | Out-Null
          "Put Windows 7 compatible Chrome/Chromium 109 chrome.exe in this folder." | Set-Content -Encoding UTF8 "$packageDir/browser/put-chrome-here.txt"
          @"
          Win7 browser shell package.

          1. Put a Windows 7 compatible Chrome/Chromium 109 portable runtime at:
             browser\chrome.exe
          2. Run Boer-LAN-Client-Win7.exe.
          3. If browser\chrome.exe is missing, the launcher opens the system default browser.
          4. Frontend assets are embedded in Boer-LAN-Client-Win7.exe.
          "@ | Set-Content -Encoding UTF8 "$packageDir/README-Win7.txt"
          Compress-Archive -Force -Path "$packageDir/*" -DestinationPath "artifacts/bohr-client-$version-win7-browser-shell.zip"

      - name: Verify no ProcessPrng in package executables
        shell: pwsh
        run: |
          $files = Get-ChildItem "artifacts/client-win7-shell" -Recurse -Filter "*.exe"
          foreach ($file in $files) {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($file.FullName))
            if ($text -match "ProcessPrng") {
              throw "ProcessPrng found in $($file.FullName); this build is not Windows 7 compatible."
            }
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-win7-browser-shell
          path: artifacts/bohr-client-*-win7-browser-shell.zip
          if-no-files-found: error
