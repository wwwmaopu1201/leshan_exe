name: Build Client Windows 7 Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: boer-lan-client/package-lock.json

      - name: Setup Go 1.20 for Windows 7
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'

      - name: Install dependencies
        working-directory: boer-lan-client
        run: npm ci

      - name: Build frontend for Windows 7 shell
        working-directory: boer-lan-client
        run: npm run build:win7

      - name: Prepare Windows 7 application files
        shell: pwsh
        run: |
          $version = (Get-Content boer-lan-client/package.json | ConvertFrom-Json).version
          $packageDir = "artifacts/client-win7-shell"
          $embeddedDist = "tools/win7-launcher/embedded-dist"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path $embeddedDist | Out-Null
          Remove-Item -Recurse -Force "$embeddedDist/*"
          Copy-Item -Recurse -Force "boer-lan-client/dist/*" "$embeddedDist/"
          go build -ldflags='-s -w -X main.defaultMode=client -X "main.defaultTitle=Boer LAN Client"' -o "$packageDir/Boer-LAN-Client-Win7.exe" ./tools/win7-launcher/main.go
          & ".github/scripts/prepare-win7-chromium.ps1" -Destination "$packageDir/browser"
          @"
          Win7 installed application with bundled Chromium 109.

          Application data is stored under:
          %APPDATA%\com.boer.lan-client

          Uninstalling the application keeps user data in that directory.
          "@ | Set-Content -Encoding UTF8 "$packageDir/README-Win7.txt"

      - name: Verify bundled Chromium runtime
        shell: pwsh
        run: |
          $chrome = "artifacts/client-win7-shell/browser/chrome.exe"
          if (-not (Test-Path -LiteralPath $chrome)) {
            throw "Bundled Chromium chrome.exe is missing."
          }
          $version = (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
          if (-not $version.StartsWith("109.0.5414.120")) {
            throw "Unexpected Chromium version: $version"
          }
          Write-Host "Verified bundled Chromium $version"

      - name: Verify no ProcessPrng in package executables
        shell: pwsh
        run: |
          $files = Get-ChildItem "artifacts/client-win7-shell" -Recurse -Filter "*.exe"
          foreach ($file in $files) {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($file.FullName))
            if ($text -match "ProcessPrng") {
              throw "ProcessPrng found in $($file.FullName); this build is not Windows 7 compatible."
            }
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build Windows 7 installer
        shell: pwsh
        run: |
          $version = (Get-Content boer-lan-client/package.json | ConvertFrom-Json).version
          $sourceDir = (Resolve-Path "artifacts/client-win7-shell").Path
          $outputDir = (Resolve-Path "artifacts").Path
          $outputFile = Join-Path $outputDir "bohr-client-$version-win7-x64-setup.exe"
          $iconFile = (Resolve-Path "boer-lan-client/src-tauri/icons/icon.ico").Path
          $installerScript = (Resolve-Path ".github/installer/win7-browser-shell.nsi").Path
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source
          }

          & $makensis `
            "/DPRODUCT_NAME=Boer LAN Client Win7" `
            "/DPRODUCT_VERSION=$version" `
            "/DPRODUCT_EXE=Boer-LAN-Client-Win7.exe" `
            "/DINSTALL_DIR_NAME=BoerLANClientWin7" `
            "/DAPP_ID=com.boer.lan-client.win7" `
            "/DSOURCE_DIR=$sourceDir" `
            "/DOUTPUT_FILE=$outputFile" `
            "/DICON_FILE=$iconFile" `
            $installerScript
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $outputFile)) {
            throw "Failed to build Windows 7 client installer."
          }
          Get-Item -LiteralPath $outputFile | Format-List FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-win7-nsis
          path: artifacts/bohr-client-*-win7-x64-setup.exe
          if-no-files-found: error
