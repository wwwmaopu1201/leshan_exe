name: Build Server Windows 7 Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: boer-lan-server/package-lock.json

      - name: Setup Go 1.20 for Windows 7
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: boer-lan-server/backend/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: boer-lan-server
        run: npm ci

      - name: Build Go backend exe for Windows 7
        working-directory: boer-lan-server/backend
        shell: pwsh
        run: |
          (Get-Content go.mod) -replace '^go 1\.21$', 'go 1.20' | Set-Content go.mod
          go version
          go build -ldflags="-s -w" -o ../src-tauri/backend-server.exe cmd/server/main.go

      - name: Build Tauri app for Windows 7
        working-directory: boer-lan-server
        run: npm run tauri:build:win7

      - name: Verify no ProcessPrng import
        working-directory: boer-lan-server
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "src-tauri/backend-server.exe"
          $files += Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/*.exe"
          foreach ($file in $files) {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($file.FullName))
            if ($text -match "ProcessPrng") {
              throw "ProcessPrng found in $($file.FullName); this build is not Windows 7 compatible."
            }
          }

      - name: Rename installer
        working-directory: boer-lan-server
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          Rename-Item -LiteralPath $installer.FullName -NewName "bohr-server-$version-win7-x64-setup.exe"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-win7-nsis
          path: boer-lan-server/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
