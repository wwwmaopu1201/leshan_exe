name: Build Server Windows 7 Installer

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: boer-lan-server/package-lock.json

      - name: Setup Go 1.20 for Windows 7
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: boer-lan-server/backend/go.sum

      - name: Install dependencies
        working-directory: boer-lan-server
        run: npm ci

      - name: Build Go backend exe for Windows 7
        working-directory: boer-lan-server/backend
        shell: pwsh
        run: |
          (Get-Content go.mod) -replace '^go 1\.21$', 'go 1.20' | Set-Content go.mod
          go version
          go build -ldflags="-s -w" -o ../src-tauri/backend-server.exe cmd/server/main.go

      - name: Build frontend for Windows 7 shell
        working-directory: boer-lan-server
        run: npm run build:win7

      - name: Prepare Windows 7 application files
        shell: pwsh
        run: |
          $version = (Get-Content boer-lan-server/package.json | ConvertFrom-Json).version
          $packageDir = "artifacts/server-win7-shell"
          $embeddedDist = "tools/win7-launcher/embedded-dist"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$packageDir/config" | Out-Null
          New-Item -ItemType Directory -Force -Path $embeddedDist | Out-Null
          Remove-Item -Recurse -Force "$embeddedDist/*"
          Copy-Item -Recurse -Force "boer-lan-server/dist/*" "$embeddedDist/"
          Copy-Item -Force "boer-lan-server/src-tauri/backend-server.exe" "$packageDir/backend-server.exe"
          Copy-Item -Recurse -Force "boer-lan-server/src-tauri/config/*" "$packageDir/config/"
          go build -ldflags='-s -w -X main.defaultMode=server -X "main.defaultTitle=Boer LAN Server"' -o "$packageDir/Boer-LAN-Server-Win7.exe" ./tools/win7-launcher/main.go
          & ".github/scripts/prepare-win7-chromium.ps1" -Destination "$packageDir/browser"
          @"
          Win7 installed application with bundled Chromium 109.

          Application data is stored under:
          %APPDATA%\com.boer.lan-server

          Uninstalling the application keeps the database and user data.
          "@ | Set-Content -Encoding UTF8 "$packageDir/README-Win7.txt"

      - name: Verify bundled Chromium runtime
        shell: pwsh
        run: |
          $chrome = "artifacts/server-win7-shell/browser/chrome.exe"
          if (-not (Test-Path -LiteralPath $chrome)) {
            throw "Bundled Chromium chrome.exe is missing."
          }
          $version = (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
          if (-not $version.StartsWith("109.0.5414.120")) {
            throw "Unexpected Chromium version: $version"
          }
          Write-Host "Verified bundled Chromium $version"

      - name: Verify no ProcessPrng in package executables
        shell: pwsh
        run: |
          $files = Get-ChildItem "artifacts/server-win7-shell" -Recurse -Filter "*.exe"
          foreach ($file in $files) {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($file.FullName))
            if ($text -match "ProcessPrng") {
              throw "ProcessPrng found in $($file.FullName); this build is not Windows 7 compatible."
            }
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build Windows 7 installer
        shell: pwsh
        run: |
          $version = (Get-Content boer-lan-server/package.json | ConvertFrom-Json).version
          $sourceDir = (Resolve-Path "artifacts/server-win7-shell").Path
          $outputDir = (Resolve-Path "artifacts").Path
          $outputFile = Join-Path $outputDir "bohr-server-$version-win7-x64-setup.exe"
          $iconFile = (Resolve-Path "boer-lan-server/src-tauri/icons/icon.ico").Path
          $installerScript = (Resolve-Path ".github/installer/win7-browser-shell.nsi").Path
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source
          }

          & $makensis `
            "/DPRODUCT_NAME=Boer LAN Server Win7" `
            "/DPRODUCT_VERSION=$version" `
            "/DPRODUCT_EXE=Boer-LAN-Server-Win7.exe" `
            "/DINSTALL_DIR_NAME=BoerLANServerWin7" `
            "/DAPP_ID=com.boer.lan-server.win7" `
            "/DBACKEND_PROCESS=backend-server.exe" `
            "/DSERVER_FIREWALL=1" `
            "/DSOURCE_DIR=$sourceDir" `
            "/DOUTPUT_FILE=$outputFile" `
            "/DICON_FILE=$iconFile" `
            $installerScript
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $outputFile)) {
            throw "Failed to build Windows 7 server installer."
          }
          Get-Item -LiteralPath $outputFile | Format-List FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-win7-nsis
          path: artifacts/bohr-server-*-win7-x64-setup.exe
          if-no-files-found: error

      - name: Add installer to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/bohr-server-*-win7-x64-setup.exe
